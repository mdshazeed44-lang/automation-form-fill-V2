version: '3.8'

services:
  form-filler:
    build: .
    container_name: form-filler-app
    restart: "no"

    environment:
      - DISPLAY=:99

    shm_size: "2gb"   # ⭐⭐⭐ MOST IMPORTANT FIX

    mem_limit: 2g
    mem_reservation: 512m
    cpus: 1.5

    stop_grace_period: 30s

    healthcheck:
      test: ["CMD", "python", "-c", "print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
